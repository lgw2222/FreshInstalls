name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app source
        run: echo "$SRC" | base64 -d | tar xz
        env:
          SRC: ""

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FreshInstalls.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FreshInstalls
          path: FreshInstalls.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Fresh Installs v1.${{ github.run_number }}
          make_latest: true
          files: FreshInstalls.apk
